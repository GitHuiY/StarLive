plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.githuiy.starlive'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'io.github.githuiy.starlive'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.0-alpha02'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            // Keep test Android downloads and their credentials out of user/global state.
            systemProperty 'maven.repo.local', new File(rootDir, '../../tools/robolectric-m2').canonicalPath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'http.nonProxyHosts'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
        animationsDisabled = true
    }
}

dependencies {
    implementation project(':plan-core')
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation platform('androidx.compose:compose-bom:2025.06.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
