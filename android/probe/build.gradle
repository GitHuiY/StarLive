plugins {
    id 'com.android.application'
}

android {
    namespace 'org.starlive.probe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.starlive.probe'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-probe'
    }
    buildTypes {
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
